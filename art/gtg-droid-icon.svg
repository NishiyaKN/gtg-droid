<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#2196F3"/>
  
  <!-- Droid head (rounded top) -->
  <path d="M 156 210
           A 100 100 0 0 1 356 210
           L 356 232
           L 156 232
           Z"
        fill="#FFFFFF"/>
  
  <!-- Droid body (rounded bottom) -->
  <rect x="156" y="242" width="200" height="160" rx="20" ry="20" fill="#FFFFFF"/>
  
  <!-- Eyes -->
  <circle cx="206" cy="190" r="14" fill="#2196F3"/>
  <circle cx="306" cy="190" r="14" fill="#2196F3"/>
  
  <!-- Antennas -->
  <line x1="186" y1="70" x2="216" y2="155" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <line x1="326" y1="70" x2="296" y2="155" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Arms -->
  <rect x="116" y="252" width="28" height="120" rx="14" ry="14" fill="#FFFFFF"/>
  <rect x="368" y="252" width="28" height="120" rx="14" ry="14" fill="#FFFFFF"/>
  
  <!-- Legs -->
  <rect x="196" y="412" width="28" height="60" rx="14" ry="14" fill="#FFFFFF"/>
  <rect x="288" y="412" width="28" height="60" rx="14" ry="14" fill="#FFFFFF"/>
  
  <!-- "GTG" mark on chest -->
  <text x="256" y="337"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="bold"
        fill="#2196F3"
        text-anchor="middle">GTG</text>
</svg>
